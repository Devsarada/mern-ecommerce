# docker-compose.yml - poora stack ek command mein (local + staging)
#   docker compose up -d --build
#   docker compose --profile tools run --rm seed      (admin + sample products)
# Saari ${...} values repo root ki .env file se aati hain (Git mein nahi).

name: mern-ecommerce

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  MONGO_URI: mongodb://${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}@mongo:27017/ecommerce?authSource=ecommerce
  UPSTASH_REDIS_URL: redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379

services:
  # ---------------- Database ----------------
  mongo:
    image: mongo:8.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_DATABASE: ecommerce
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    logging: *default-logging

  # ---------------- Cache ----------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192m }
    logging: *default-logging

  # ---------------- Backend API ----------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: mern-backend:local
    environment:
      <<: *backend-env
      NODE_ENV: production
      PORT: "5000"
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set CLOUDINARY_CLOUD_NAME in .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in .env}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [public, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }
    logging: *default-logging

  # ---------------- Frontend (Nginx) ----------------
  frontend:
    build:
      context: ./frontend
    image: mern-frontend:local
    environment:
      BACKEND_HOST: backend:5000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend: { condition: service_healthy }
    networks: [public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    logging: *default-logging

  # ---------------- One-off: seed data ----------------
  seed:
    image: mern-backend:local
    profiles: [tools]
    command: ["node", "backend/scripts/seed.js"]
    environment:
      <<: *backend-env
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Store Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      SEED_FORCE_ADMIN_PASSWORD: ${SEED_FORCE_ADMIN_PASSWORD:-false}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [data]
    restart: "no"

networks:
  public: {}            # frontend <-> backend (aur backend ka internet: Stripe, Cloudinary)
  data:
    internal: true      # sirf backend <-> mongo/redis; internet nahi, bahar se nahi

volumes:
  mongo-data: {}
  redis-data: {}