# frontend/nginx/security-headers.conf
# Har response ke saath browser ko security niyam.
# (nginx mein location ke andar add_header lagaya to upar wale inherit nahi hote,
#  isliye ye file har jagah include karte hain)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;